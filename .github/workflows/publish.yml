# Publishes a release to npm when "pnpm release" pushes its v<version> tag. The tag points at a commit on main; the
# job builds and tests that commit, then publishes it through npm's trusted publishing (no token stored here;
# provenance is added).
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: The tag is on main and matches the package version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - run: pnpm test
      - name: Publish (skipped when this version is already on npm)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm"
          else
            npm publish --access public --ignore-scripts
          fi
