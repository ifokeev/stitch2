<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="gg-screen" content="screen-name" />
<meta name="gg-device" content="desktop" />
<meta name="gg-status" content="draft" />
<meta name="gg-source" content="lab" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="gg-frame-width" content="1280" />
<title>gymgym — Screen name</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" type="text/tailwindcss" href="/tokens.tailwind.css" />
<script src="https://unpkg.com/lucide@1.51.0/dist/umd/lucide.min.js"></script>
<script src="/components/gg.elements.js" defer></script>
</head>
<!--
  Desktop template for gymgym screens (stitch2): copy to design/screens/<screen>/desktop-v<N>.html after the
  screen's mobile version, keeping its components and content. The sidebar replaces the tab bar; content is at
  most 960px wide, with a 320px side column where it helps (grid-cols-[minmax(0,1fr)_320px]). A sheet becomes a
  dialog by itself: put <gg-sheet> after the layout. Desktop forms of the components: catalog-desktop.html.
-->
<body class="relative min-h-screen bg-floor font-sans text-chalk antialiased">
  <div class="flex">
    <gg-sidebar active="home"></gg-sidebar>
    <main class="min-w-0 flex-1 px-10 pb-12 pt-8"><div class="mx-auto max-w-[960px]">
      <gg-header title="Title"></gg-header>
    </div></main>
  </div>
</body>
</html>
