<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="gg-status" content="approved" />
<meta name="gg-screen" content="home" />
<meta name="gg-device" content="mobile" />
<meta name="gg-source" content="lab" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="gg-frame-width" content="390" />
<title>gymgym — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" type="text/tailwindcss" href="/tokens.tailwind.css" />
<script src="https://unpkg.com/lucide@1.51.0/dist/umd/lucide.min.js"></script>
<script src="/components/gg.elements.js" defer></script>
</head>
<body class="relative min-h-screen bg-floor font-sans text-chalk antialiased">
  <main class="mx-auto max-w-[390px] px-4 pb-32 pt-6">
<gg-header meta="Tuesday, 6 October" title="Hi, Ivan">
  <gg-icon-button icon="history" label="History"></gg-icon-button>
  <gg-icon-button icon="settings" label="Settings"></gg-icon-button>
</gg-header>
<div class="mb-6"><gg-week days="Mon 5,Tue 6,Wed 7,Thu 8,Fri 9,Sat 10,Sun 11" marks="dprpppr" selected="1"></gg-week></div>
<div class="mb-6"><gg-card>
  <gg-card-header title="Push"><gg-chip>5 exercises</gg-chip></gg-card-header>
  <div class="flex items-baseline justify-between gap-3">
    <p class="truncate type-body-strong text-chalk">Barbell Bench Press</p>
    <gg-stat value="82.5" unit="kg"></gg-stat>
  </div>
  <p class="mt-1 flex items-center gap-1.5 type-meta text-steel"><i data-lucide="trending-up" class="size-4 shrink-0 text-success" aria-hidden="true"></i><span class="truncate">4 × 6 · every rep last time, 2.5 kg more</span></p>
  <gg-card-note>Incline Dumbbell Press, Overhead Press, Dips, Triceps Pushdown</gg-card-note>
  <div class="mt-4"><gg-button icon="play" full>Start Push</gg-button></div>
</gg-card></div>
<div class="mb-6 grid grid-cols-2 gap-3"><gg-card>
  <gg-card-header label="Body weight"></gg-card-header>
  <gg-stat value="80.7" unit="kg" note="Goal 79 kg"></gg-stat>
  
</gg-card><gg-card>
  <gg-card-header label="Streak"></gg-card-header>
  <gg-stat value="4" unit="weeks" note="3 of 5 this week"></gg-stat>
</gg-card></div>
<gg-section label="Recent workouts" link="History">
  <gg-card list>
    <gg-row icon="footprints" name="Legs" meta="Sun, 4 Oct" value-meta="55 min · 14 sets" chevron></gg-row>
    <gg-row icon="arrow-down" name="Pull" meta="Fri, 2 Oct" value-meta="61 min · 15 sets" chevron></gg-row>
    <gg-row icon="arrow-up" name="Push" meta="Wed, 30 Sep" value-meta="52 min · 16 sets" chevron></gg-row>
  </gg-card>
</gg-section>
  </main>
  <gg-tab-bar active="home"></gg-tab-bar>
</body>
</html>
