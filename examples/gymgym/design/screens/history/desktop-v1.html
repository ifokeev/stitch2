<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="gg-status" content="approved" />
<meta name="gg-screen" content="history" />
<meta name="gg-device" content="desktop" />
<meta name="gg-source" content="lab" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="gg-frame-width" content="1280" />
<title>gymgym — History</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" type="text/tailwindcss" href="/tokens.tailwind.css" />
<script src="https://unpkg.com/lucide@1.51.0/dist/umd/lucide.min.js"></script>
<script src="/components/gg.elements.js" defer></script>
</head>
<body class="relative min-h-screen bg-floor font-sans text-chalk antialiased">
  <div class="flex">
    <gg-sidebar active="history"></gg-sidebar>
    <main class="min-w-0 flex-1 px-10 pb-12 pt-8"><div class="mx-auto max-w-[960px]">
<gg-header title="History">
  <gg-icon-button icon="plus" label="Add a past workout"></gg-icon-button>
</gg-header>
<div class="grid grid-cols-[minmax(0,1fr)_400px] items-start gap-6">
  <div><gg-section label="October">
  <gg-card list>
    <gg-row icon="footprints" name="Legs" meta="Sun, 4 Oct · 7,920 kg" value-meta="55 min · 14 sets" chevron selected></gg-row>
    <gg-row icon="arrow-down" name="Pull" meta="Fri, 2 Oct · 6,315 kg" value-meta="61 min · 15 sets" chevron></gg-row>
  </gg-card>
</gg-section>
<gg-section label="September">
  <gg-card list>
    <gg-row icon="arrow-up" name="Push" meta="Wed, 30 Sep · 6,480 kg" value-meta="52 min · 16 sets" chevron></gg-row>
    <gg-row icon="footprints" name="Legs" meta="Mon, 28 Sep · 7,655 kg" value-meta="58 min · 14 sets" chevron></gg-row>
    <gg-row icon="arrow-down" name="Pull" meta="Sat, 26 Sep · 6,090 kg" value-meta="57 min · 15 sets" chevron></gg-row>
    <gg-row icon="arrow-up" name="Push" meta="Thu, 24 Sep · 6,375 kg" value-meta="49 min · 16 sets" chevron></gg-row>
    <gg-row icon="footprints" name="Legs" meta="Tue, 22 Sep · 7,410 kg" value-meta="63 min · 14 sets" chevron></gg-row>
  </gg-card>
</gg-section></div>
  <gg-card>
    <gg-card-header title="Legs"><gg-icon-button icon="ellipsis" label="Edit, copy or save as routine"></gg-icon-button></gg-card-header>
    <p class="-mt-2 mb-4 type-meta text-steel">Sunday, 4 October · 18:05</p>
    <div class="-mx-4 mb-4 grid grid-cols-3 divide-x divide-hairline border-y border-hairline">
      <div class="px-4 py-3"><gg-stat label="Duration" value="55:20"></gg-stat></div>
      <div class="px-4 py-3"><gg-stat label="Sets" value="14"></gg-stat></div>
      <div class="px-4 py-3"><gg-stat label="Volume" value="7,920" unit="kg"></gg-stat></div>
    </div>
    <div class="space-y-4">
      <div><p class="type-body-strong text-chalk">Back Squat</p><p class="type-meta-number text-steel">120 × 5 · 120 × 5 · 120 × 5 · 120 × 4</p></div>
      <div><p class="type-body-strong text-chalk">Romanian Deadlift</p><p class="type-meta-number text-steel">100 × 8 · 100 × 8 · 100 × 7</p></div>
      <div><p class="type-body-strong text-chalk">Leg Press</p><p class="type-meta-number text-steel">180 × 12 · 180 × 11 · 180 × 10</p></div>
      <div><p class="type-body-strong text-chalk">Standing Calf Raise</p><p class="type-meta-number text-steel">60 × 15 · 60 × 14 · 60 × 12 · 60 × 12</p></div>
    </div>
  </gg-card>
</div>
    </div></main>
  </div>

</body>
</html>
