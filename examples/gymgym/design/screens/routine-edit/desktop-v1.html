<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="gg-status" content="approved" />
<meta name="gg-screen" content="routine-edit" />
<meta name="gg-device" content="desktop" />
<meta name="gg-source" content="lab" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="gg-frame-width" content="1280" />
<title>gymgym — Edit routine</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" type="text/tailwindcss" href="/tokens.tailwind.css" />
<script src="https://unpkg.com/lucide@1.51.0/dist/umd/lucide.min.js"></script>
<script src="/components/gg.elements.js" defer></script>
</head>
<body class="relative min-h-screen bg-floor font-sans text-chalk antialiased">
  <div class="flex">
    <gg-sidebar active="plan"></gg-sidebar>
    <main class="min-w-0 flex-1 px-10 pb-12 pt-8"><div class="mx-auto max-w-[960px]">
<gg-header meta="Routine" title="Push">
  <gg-icon-button icon="ellipsis" label="Copy, print or delete"></gg-icon-button>
  <gg-button>Save routine</gg-button>
</gg-header>
<div class="grid grid-cols-[minmax(0,1fr)_340px] items-start gap-6">
  <div><div class="mb-6 space-y-4">
  <gg-field label="Name" value="Push"></gg-field>
  <gg-field label="Progression rule" value="Linear progression" picker hint="Every rep made: add a step. Three missed sessions at one weight: 10 % deload."></gg-field>
</div><gg-section label="Exercises" link="Add exercise">
  <gg-card list>
    <gg-row icon="dumbbell" name="Barbell Bench Press" meta="4 × 6 · 82.5 kg · rest 2:30" chevron></gg-row>
    <gg-row icon="dumbbell" name="Incline Dumbbell Press" meta="3 × 8–12 · 30 kg · double progression" chevron></gg-row>
    <gg-row icon="dumbbell" name="Overhead Press" meta="3 × 6 · 50 kg" chevron></gg-row>
    <gg-row icon="dumbbell" name="Dips" meta="3 × 10 · body weight · superset" chevron></gg-row>
    <gg-row icon="dumbbell" name="Triceps Pushdown" meta="3 × 12 · 25 kg · superset" chevron></gg-row>
  </gg-card>
</gg-section></div>
  <div><gg-section label="What this routine hits">
  <gg-card><gg-body-map shade="chest:1,triceps:0.8,shoulders:0.7,traps:0.2" label="Muscles this routine trains"></gg-body-map></gg-card>
</gg-section></div>
</div>
    </div></main>
  </div>

</body>
</html>
