<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="gg-status" content="approved" />
<meta name="gg-screen" content="sign-in" />
<meta name="gg-device" content="desktop" />
<meta name="gg-source" content="lab" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="gg-frame-width" content="1280" />
<title>gymgym — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" type="text/tailwindcss" href="/tokens.tailwind.css" />
<script src="https://unpkg.com/lucide@1.51.0/dist/umd/lucide.min.js"></script>
<script src="/components/gg.elements.js" defer></script>
</head>
<body class="min-h-screen bg-floor font-sans text-chalk antialiased">
  <main class="flex min-h-screen items-center justify-center px-6 py-16">
    <div class="w-full max-w-[420px] rounded-sheet border border-hairline bg-iron p-8">
<div class="mb-8"><gg-logo></gg-logo></div>
<gg-header title="Sign in"></gg-header>
<p class="-mt-4 mb-8 type-body text-steel">Your data stays yours: export it any time.</p>
<div class="space-y-3">
  <gg-button icon="key-round" full>Sign in with a passkey</gg-button>
  <gg-button variant="secondary" full>Continue with Google</gg-button>
  <gg-button variant="secondary" full>Continue with GitHub</gg-button>
</div>
<div class="my-6 flex items-center gap-3 type-meta text-steel"><span class="h-px flex-1 bg-hairline"></span>or<span class="h-px flex-1 bg-hairline"></span></div>
<gg-button variant="ghost" full>Continue as guest</gg-button>
<p class="mt-2 text-center type-meta text-steel">Guest data is kept on the server. Link Google, GitHub or a passkey later to keep it for good.</p>
    </div>
  </main>
</body>
</html>
