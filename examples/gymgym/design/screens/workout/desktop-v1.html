<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta name="gg-status" content="approved" />
<meta name="gg-screen" content="workout" />
<meta name="gg-device" content="desktop" />
<meta name="gg-source" content="lab" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="gg-frame-width" content="1280" />
<title>gymgym — Workout</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" type="text/tailwindcss" href="/tokens.tailwind.css" />
<script src="https://unpkg.com/lucide@1.51.0/dist/umd/lucide.min.js"></script>
<script src="/components/gg.elements.js" defer></script>
</head>
<body class="relative min-h-screen bg-floor font-sans text-chalk antialiased">
  <div class="flex">
    <gg-sidebar workout></gg-sidebar>
    <main class="min-w-0 flex-1 px-10 pb-12 pt-8"><div class="mx-auto max-w-[960px]">
<gg-header title="Push" sub="23:41 · 7 of 16 sets">
  <gg-button size="sm">Finish</gg-button>
</gg-header>
<div class="grid grid-cols-[minmax(0,1fr)_320px] items-start gap-6">
  <div><gg-card>
  <gg-card-header title="Barbell Bench Press"><gg-icon-button icon="ellipsis" label="Exercise options"></gg-icon-button></gg-card-header>
  <p class="-mt-1 mb-4 flex items-center gap-1.5 type-meta text-steel"><i data-lucide="trending-up" class="size-4 shrink-0 text-success" aria-hidden="true"></i><span class="truncate">Every rep last time, 2.5 kg more</span></p>
  <gg-set-header></gg-set-header>
  <div class="space-y-2">
    <gg-set-row set="1" weight="82.5" reps="6" rpe="8" state="done"></gg-set-row>
    <gg-set-row set="2" weight="82.5" reps="6" rpe="8.5" state="done"></gg-set-row>
    <gg-set-row set="3" weight="82.5" reps="6" state="active" note="Each side: 20 + 10 + 1.25"></gg-set-row>
    <gg-set-row set="4" weight="82.5" reps="6" state="todo"></gg-set-row>
  </div>
  <div class="mt-4 grid grid-cols-2 gap-3">
    <gg-button variant="secondary" icon="plus">Add set</gg-button>
    <gg-button variant="danger">Remove set</gg-button>
  </div>
</gg-card>
<div class="mt-4 grid grid-cols-[auto_minmax(0,1fr)] gap-3">
  <gg-button variant="ghost" icon="chevron-left">Previous</gg-button>
  <gg-button variant="secondary" trailing-icon="chevron-right">Next: Incline Press</gg-button>
</div></div>
  <div class="space-y-6">
    <gg-rest-timer time="1:32" progress="62"></gg-rest-timer>
    <gg-section label="Exercises" link="Add exercise">
      <gg-card list>
        <gg-row name="Barbell Bench Press" meta="4 × 6 · 82.5 kg" value-meta="3/4"></gg-row>
        <gg-row name="Incline Dumbbell Press" meta="3 × 10 · 30 kg" value-meta="0/3"></gg-row>
        <gg-row name="Overhead Press" meta="3 × 6 · 50 kg" value-meta="0/3"></gg-row>
        <gg-row name="Dips" meta="3 × 10 · superset" value-meta="0/3"></gg-row>
        <gg-row name="Triceps Pushdown" meta="3 × 12 · superset" value-meta="0/3"></gg-row>
      </gg-card>
    </gg-section>
  </div>
</div>
    </div></main>
  </div>

</body>
</html>
